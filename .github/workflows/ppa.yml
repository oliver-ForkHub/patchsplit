name: Notify PPA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to package (tag, branch, or commit)"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ppa-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  upload-source:
    name: Upload source package to Launchpad
    runs-on: ubuntu-latest
    env:
      PPA_OWNER: ${{ vars.PPA_OWNER }}
      PPA_NAME: ${{ vars.PPA_NAME }}
      PPA_GPG_KEY_ID: ${{ vars.PPA_GPG_KEY_ID }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check PPA configuration
        run: |
          set -euo pipefail
          test -n "$PPA_OWNER" || { echo "Repository variable PPA_OWNER is required" >&2; exit 1; }
          test -n "$PPA_NAME" || { echo "Repository variable PPA_NAME is required" >&2; exit 1; }
          test -n "$PPA_GPG_KEY_ID" || { echo "Repository variable PPA_GPG_KEY_ID is required" >&2; exit 1; }
          test -n "${PPA_GPG_PRIVATE_KEY:-}" || { echo "Secret PPA_GPG_PRIVATE_KEY is required" >&2; exit 1; }
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cargo \
            debhelper \
            devscripts \
            dh-cargo \
            dpkg-dev \
            dput \
            rustc

      - name: Import signing key
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/gnupg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          printf '%s\n' "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build signed source package
        env:
          DEBEMAIL: ${{ vars.PPA_MAINTAINER_EMAIL || 'noreply@github.com' }}
          DEBFULLNAME: ${{ vars.PPA_MAINTAINER_NAME || github.repository_owner }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^patchsplit (\([^ )]*\).*/\1/p' debian/changelog | head -n 1)
          test -n "$version"
          upstream_version="${version%%-*}"
          ref="${{ github.event.release.tag_name || inputs.ref || github.sha }}"

          git archive --format=tar.gz --prefix="patchsplit-${upstream_version}/" "$ref" \
            -o "../patchsplit_${upstream_version}.orig.tar.gz"
          test -f "../patchsplit_${upstream_version}.orig.tar.gz"
          ! tar -tzf "../patchsplit_${upstream_version}.orig.tar.gz" \
            | grep -E '(^|/)(target|debian/cargo_home|debian/cargo_registry)(/|$)'

          # Launchpad resolves Build-Depends when it builds the uploaded source.
          # The GitHub runner may not have the exact dependency versions, so do
          # not require them for this source-only package build.
          dpkg-buildpackage -S -sa -us -uc -d

          changes="../patchsplit_${version}_source.changes"
          test -f "$changes"
          debsign -k"$PPA_GPG_KEY_ID" "$changes"
          gpg --verify "$changes"
          gpg --verify "../patchsplit_${version}.dsc"

      - name: Upload to Launchpad PPA
        run: |
          set -euo pipefail
          changes=$(find .. -maxdepth 1 -type f -name 'patchsplit_*_source.changes' -print -quit)
          test -n "$changes"
          dput "ppa:${PPA_OWNER}/${PPA_NAME}" "$changes"
