name: Build packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: patchsplit-linux-x86_64
            asset: patchsplit-linux-x86_64.tar.gz
            archive: tar.gz
            binary: patchsplit
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            package: patchsplit-macos-x86_64
            asset: patchsplit-macos-x86_64.tar.gz
            archive: tar.gz
            binary: patchsplit
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: patchsplit-windows-x86_64
            asset: patchsplit-windows-x86_64.zip
            archive: zip
            binary: patchsplit.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        if: matrix.os != 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          chmod +x "dist/${{ matrix.binary }}"
          tar -czf "${{ matrix.package }}.tar.gz" -C dist "${{ matrix.binary }}"

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.package }}.zip" -Force

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  build-debian:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Debian package in Debian Trixie
        run: |
          set -euo pipefail
          mkdir -p debian-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/debian-artifacts:/artifacts" \
            -w /tmp \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install --no-install-recommends -y \
                build-essential \
                cargo \
                debhelper-compat \
                dh-cargo \
                git \
                dpkg-dev \
                librust-thiserror-dev \
                python3:native \
                rustc
              thiserror_version=$(dpkg-query -W -f="\${Version}" librust-thiserror-dev)
              dpkg --compare-versions "$thiserror_version" ge 2.0.0
              cp -a /workspace /tmp/patchsplit
              cd /tmp/patchsplit
              dpkg-buildpackage --build=binary --no-sign
              cp /tmp/patchsplit_*.deb /artifacts/
            '

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: patchsplit-debian-amd64
          path: debian-artifacts/patchsplit_*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM package in Fedora
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rpm-artifacts
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          git archive --format=tar.gz --prefix="patchsplit-${version}/" HEAD \
            -o "patchsplit-${version}.tar.gz"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/rpm-artifacts:/artifacts" \
            -w /tmp \
            fedora:latest \
            bash -euxo pipefail -c '
              dnf install -y \
                cargo \
                gcc \
                git \
                make \
                redhat-rpm-config \
                rpm-build \
                rust
              version=$(sed -n "s/^version = \"\\([^\"]*\\)\"/\\1/p" /workspace/Cargo.toml | head -n 1)
              topdir=/tmp/rpmbuild
              mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              cp "/workspace/patchsplit-${version}.tar.gz" "$topdir/SOURCES/"
              cp /workspace/packaging/patchsplit.spec "$topdir/SPECS/"
              rpmbuild --define "_topdir $topdir" -bb "$topdir/SPECS/patchsplit.spec"
              cp "$topdir"/RPMS/*/patchsplit-*.rpm /artifacts/
            '

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: patchsplit-rpm-x86_64
          path: rpm-artifacts/patchsplit-*.rpm
          if-no-files-found: error
